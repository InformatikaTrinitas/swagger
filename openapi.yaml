          example: transportasi
        - in: query
          name: aksi
          required: false
          description: Filter jenis aksi.
          schema:
            type: string
            enum:
              - CREATE
              - UPDATE
              - DELETE
              - LOGIN
              - VERIFY
        - in: query
          name: dari
          required: false
          description: Tanggal awal log.
          schema:
            type: string
            format: date
        - in: query
          name: sampai
          required: false
          description: Tanggal akhir log.
          schema:
            type: string
            format: date
        - in: query
          name: page
          required: false
          description: Halaman data yang diminta.
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: per_page
          required: false
          description: Jumlah data per halaman.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
