openapi: 3.0.3
info:
  title: Find Holiday API
  version: 1.0.0
  description: >-
    Kontrak API untuk aplikasi Find Holiday: Context Aware Tourist Mobility.


    Kontrak ini disusun dari dokumen kebutuhan, dokumen DFD-01 sampai DFD-10, rencana arsitektur, dan skema basis data
    pada sql/db_ppl.sql.


    ## Cara mencoba tanpa backend


    1. Pilih peran aktif pada bilah atas halaman Swagger.

    2. Pilih skenario respons. Pilihan positif mengembalikan kode 2xx. Pilihan negatif mengembalikan contoh kesalahan
    yang relevan.

    3. Buka salah satu endpoint, tekan Try it out, lalu tekan Execute.

    4. Semua permintaan dijawab oleh lapisan simulasi di browser. Tidak ada permintaan yang dikirim ke server.


    ## Pola umum


    - Base path: /api/v1

    - Autentikasi: Bearer token dengan izin sesuai peran.

    - Sukses: amplop data, pesan opsional, dan meta untuk daftar.

    - Gagal: objek error berisi code dan message, ditambah request_id.

    - Tanggal: YYYY-MM-DD. Waktu: YYYY-MM-DD HH:MM:SS pada zona Asia/Jakarta.

    - Boolean pada API dipetakan dari nilai 0 atau 1 pada basis data.


    Dokumentasi lengkap tersedia pada folder docs dan dapat dibuka dari tautan Dokumentasi pada halaman simulasi.
  contact:
    name: Tim Find Holiday
    email: tim@findholiday.id
  license:
    name: Hak cipta Find Holiday
externalDocs:
  description: Dokumentasi Markdown dan HTML
  url: ./docs/index.html
servers:
  - url: ./api/v1
    description: Simulasi di browser tanpa backend
tags:
  - name: Sistem
    description: Pemeriksaan kesehatan layanan untuk pemantauan dan deployment.
  - name: Autentikasi dan Akun
    description: >-
      Pendaftaran, login, profil, kata sandi, dan penghapusan akun. Semua endpoint selain register dan login memerlukan
      token Bearer.
  - name: Destinasi dan Ulasan
    description: Jelajah destinasi, peta, detail tempat, fasilitas, dan ulasan pengunjung.
  - name: Wilayah dan Konteks
    description: Data wilayah layanan, cuaca terkini, serta konteks lalu lintas yang dipakai mesin rekomendasi.
  - name: Transportasi
    description: Katalog moda transportasi, tarif, kapasitas, dan wilayah layanan.
  - name: Itinerary
    description: Pembuatan, perubahan, penghapusan, urutan perhentian, dan geometri rute itinerary.
  - name: Rekomendasi dan Riwayat
    description: Perhitungan rekomendasi kontekstual, perbandingan strategi, penjelasan faktor, dan riwayat.
  - name: Notifikasi
    description: Peringatan perjalanan, aliran event real time, dan pengelolaan status baca.
  - name: Mitra
    description: Pengelolaan armada mitra beserta tarif, ketersediaan, dan jejak audit perubahan.
  - name: Admin
    description: >-
      Pengelolaan pengguna, mitra, wilayah, destinasi, fasilitas, transportasi, konteks, itinerary, rekomendasi,
      notifikasi, ulasan, dan jejak audit.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags:
        - Sistem
      summary: Cek kesehatan layanan
      description: >-
        Memeriksa status layanan utama, basis data, layanan cuaca, dan mesin rekomendasi. Endpoint ini dapat dipanggil
        tanpa token.
      operationId: getHealth
      responses:
        '200':
          description: Layanan berjalan normal.
          headers:
            X-Request-Id:
              description: ID permintaan untuk penelusuran log.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Health'
                  message:
                    type: string
                    description: Pesan singkat untuk pengguna.
              example:
                data:
                  status: ok
                  service: find-holiday-api
                  version: 1.0.0
                  waktu: '2026-10-30 15:50:00'
                  pemeriksaan:
                    database: ok
                    weather_service: ok
                    recommendation_engine: ok
        '400':
          description: >-
            Parameter permintaan tidak valid atau format data salah. [BAD_REQUEST]: Format parameter pada permintaan cek
            kesehatan layanan tidak valid atau nilai query di luar batas yang diizinkan.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: BAD_REQUEST
                  message: >-
                    Format parameter pada permintaan cek kesehatan layanan tidak valid atau nilai query di luar batas
                    yang diizinkan.
                request_id: req_demo_0001
        '429':
          description: >-
            Batas frekuensi permintaan terlampaui (Rate limited). [RATE_LIMITED]: Frekuensi permintaan melampaui batas
            kuota API Find Holiday. Silakan tunggu beberapa saat sebelum mengirim permintaan kembali.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
            Retry-After:
              description: Jumlah detik untuk menunggu sebelum mengirimkan permintaan berikutnya.
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: RATE_LIMITED
                  message: >-
                    Frekuensi permintaan melampaui batas kuota API Find Holiday. Silakan tunggu beberapa saat sebelum
                    mengirim permintaan kembali.
                request_id: req_demo_0002
        '500':
          description: >-
            Terjadi kesalahan internal pada server. [INTERNAL_ERROR]: Terjadi kesalahan pada server saat memproses
            permintaan.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Terjadi kesalahan pada server saat memproses permintaan.
                request_id: req_demo_0003
        '503':
          description: >-
            Layanan pihak ketiga pendukung sedang tidak tersedia. [UPSTREAM_UNAVAILABLE]: Layanan pendukung eksternal
            sedang mengalami gangguan atau tidak dapat dihubungi.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UPSTREAM_UNAVAILABLE
                  message: Layanan pendukung eksternal sedang mengalami gangguan atau tidak dapat dihubungi.
                request_id: req_demo_0004
      security: []
      x-roles:
        - public
      x-kf:
        - KNF-02
  /auth/register:
    post:
      tags:
        - Autentikasi dan Akun
      summary: Daftar akun baru
      description: >-
        Membuat akun wisatawan atau mitra. Pendaftaran admin tidak tersedia dari endpoint publik. Setelah berhasil,
        token Bearer langsung dikirim agar pengguna dapat masuk ke aplikasi.
      operationId: registerUser
      responses:
        '201':
          description: Akun berhasil dibuat.
          headers:
            X-Request-Id:
              description: ID permintaan untuk penelusuran log.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSession'
                  message:
                    type: string
                    description: Pesan singkat untuk pengguna.
              example:
                data:
                  user:
                    user_id: 8c1a6f2e-5b7d-4a91-9f03-1a2b3c4d5e99
                    nama: Budi Santoso
                    email: budi.santoso@example.com
                    nomor_telepon: '+6281234567890'
                    role: tourist
                    profil:
                      preferensi_umum: Wisata Budaya & Kuliner
                      jumlah_itinerary: 0
                      jumlah_notifikasi_belum_dibaca: 0
                  token: 1|fh_demo_tourist_9f8e7d6c5b4a39281706
                  token_type: Bearer
                  abilities:
                    - role:tourist
                message: Akun berhasil dibuat. Token sudah dapat dipakai.
        '400':
          description: >-
            Parameter permintaan tidak valid atau format data salah. [BAD_REQUEST]: Struktur tubuh permintaan (request
            body) tidak dapat diproses atau format JSON rusak.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: BAD_REQUEST
                  message: Struktur tubuh permintaan (request body) tidak dapat diproses atau format JSON rusak.
                request_id: req_demo_0001
        '409':
          description: 'Terjadi konflik data atau tabrakan status entitas. [EMAIL_ALREADY_USED]: Email sudah dipakai oleh akun lain.'
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: EMAIL_ALREADY_USED
                  message: Email sudah dipakai oleh akun lain.
                request_id: req_demo_0002
        '422':
          description: 'Validasi data masukan gagal. [VALIDATION_ERROR]: Data pendaftaran belum lengkap atau formatnya belum benar.'
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Data pendaftaran belum lengkap atau formatnya belum benar.
                  details:
                    - field: email
                      message: Format email belum benar.
                    - field: password
                      message: Kata sandi minimal 8 karakter.
                request_id: req_demo_0003
        '429':
          description: >-
            Batas frekuensi permintaan terlampaui (Rate limited). [RATE_LIMITED]: Terlalu banyak percobaan pendaftaran.
            Coba lagi beberapa saat lagi.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
            Retry-After:
              description: Jumlah detik untuk menunggu sebelum mengirimkan permintaan berikutnya.
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: RATE_LIMITED
                  message: Terlalu banyak percobaan pendaftaran. Coba lagi beberapa saat lagi.
                request_id: req_demo_0004
        '500':
          description: >-
            Terjadi kesalahan internal pada server. [INTERNAL_ERROR]: Terjadi kesalahan pada server saat memproses
            permintaan.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Terjadi kesalahan pada server saat memproses permintaan.
                request_id: req_demo_0005
      security: []
      x-roles:
        - public
      x-kf:
        - KF-03
      requestBody:
        required: true
        description: Data akun baru. Isi preferensi_umum untuk wisatawan atau nama_perusahaan untuk mitra.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
            example:
              nama: Budi Santoso
              email: budi.santoso@example.com
              password: SecurePassword123!
              password_confirmation: SecurePassword123!
              nomor_telepon: '+6281234567890'
              role: tourist
              preferensi_umum: Wisata Budaya & Kuliner
  /auth/login:
    post:
      tags:
        - Autentikasi dan Akun
      summary: Masuk ke aplikasi
      description: >-
        Memeriksa email dan kata sandi, lalu membuat token Bearer dengan izin sesuai peran. Respons contoh tersedia
        untuk wisatawan, mitra, dan admin melalui pilihan peran pada halaman simulasi.
      operationId: loginUser
      responses:
        '200':
          description: Login berhasil.
          headers:
            X-Request-Id:
              description: ID permintaan untuk penelusuran log.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSession'
                  message:
                    type: string
                    description: Pesan singkat untuk pengguna.
              example:
                data:
                  user:
                    user_id: 8c1a6f2e-5b7d-4a91-9f03-1a2b3c4d5e01
                    nama: Alfian Hanif
                    email: alfian.hanif@example.com
                    nomor_telepon: '+6281321001001'
                    role: tourist
                    profil:
                      preferensi_umum: Wisata Budaya & Kuliner
                      jumlah_itinerary: 2
                      jumlah_notifikasi_belum_dibaca: 3
                  token: 1|fh_demo_tourist_9f8e7d6c5b4a39281706
                  token_type: Bearer
                  abilities:
                    - role:tourist
                message: Login berhasil.
        '400':
          description: >-
            Parameter permintaan tidak valid atau format data salah. [BAD_REQUEST]: Struktur tubuh permintaan (request
            body) tidak dapat diproses atau format JSON rusak.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: BAD_REQUEST
                  message: Struktur tubuh permintaan (request body) tidak dapat diproses atau format JSON rusak.
                request_id: req_demo_0001
        '401':
          description: >-
            Autentikasi gagal atau token Bearer tidak valid. [INVALID_CREDENTIALS]: Email atau kata sandi tidak cocok.
            Periksa kembali data Anda.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Email atau kata sandi tidak cocok. Periksa kembali data Anda.
                request_id: req_demo_0002
        '409':
          description: >-
            Terjadi konflik data atau tabrakan status entitas. [CONFLICT]: Permintaan bertentangan dengan data atau
            kondisi sistem saat ini (misalnya duplikasi data unik atau benturan jadwal/relasi entitas).
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: CONFLICT
                  message: >-
                    Permintaan bertentangan dengan data atau kondisi sistem saat ini (misalnya duplikasi data unik atau
                    benturan jadwal/relasi entitas).
                request_id: req_demo_0003
        '422':
          description: 'Validasi data masukan gagal. [VALIDATION_ERROR]: Email atau kata sandi belum diisi dengan benar.'
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Email atau kata sandi belum diisi dengan benar.
                  details:
                    - field: email
                      message: Email wajib diisi.
                    - field: password
                      message: Kata sandi wajib diisi.
                request_id: req_demo_0004
        '429':
          description: >-
            Batas frekuensi permintaan terlampaui (Rate limited). [RATE_LIMITED]: Terlalu banyak percobaan login. Coba
            lagi setelah beberapa menit.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
            Retry-After:
              description: Jumlah detik untuk menunggu sebelum mengirimkan permintaan berikutnya.
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: RATE_LIMITED
                  message: Terlalu banyak percobaan login. Coba lagi setelah beberapa menit.
                request_id: req_demo_0005
        '500':
          description: >-
            Terjadi kesalahan internal pada server. [INTERNAL_ERROR]: Terjadi kesalahan pada server saat memproses
            permintaan.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Terjadi kesalahan pada server saat memproses permintaan.
                request_id: req_demo_0006
      security: []
      x-roles:
        - public
      x-kf:
        - KF-01
        - KF-02
      requestBody:
        required: true
        description: Email dan kata sandi akun terdaftar.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              email: alfian.hanif@example.com
              password: RahasiaDemo123!
  /auth/logout:
    post:
      tags:
        - Autentikasi dan Akun
      summary: Keluar dari aplikasi
      description: Mencabut token yang sedang dipakai. Setelah berhasil, token tidak dapat digunakan lagi.
      operationId: logoutUser
      responses:
        '204':
          description: Token berhasil dicabut. Tidak ada isi respons.
        '400':
          description: >-
            Parameter permintaan tidak valid atau format data salah. [BAD_REQUEST]: Parameter permintaan tidak dapat
            diproses atau format data tidak valid.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: BAD_REQUEST
                  message: Parameter permintaan tidak dapat diproses atau format data tidak valid.
                request_id: req_demo_0001
        '401':
          description: >-
            Autentikasi gagal atau token Bearer tidak valid. [UNAUTHENTICATED]: Sesi tidak valid, token kedaluwarsa,
            atau token tidak dikirim.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Sesi tidak valid, token kedaluwarsa, atau token tidak dikirim.
                request_id: req_demo_0002
        '403':
          description: >-
            Peran pengguna aktif tidak memiliki izin untuk tindakan ini. [FORBIDDEN_ROLE]: Peran aktif tidak memiliki
            izin untuk mengakses sumber daya ini.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: FORBIDDEN_ROLE
                  message: Peran aktif tidak memiliki izin untuk mengakses sumber daya ini.
                request_id: req_demo_0003
        '409':
          description: >-
            Terjadi konflik data atau tabrakan status entitas. [CONFLICT]: Permintaan bertentangan dengan data atau
            kondisi sistem saat ini (misalnya duplikasi data unik atau benturan jadwal/relasi entitas).
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: CONFLICT
                  message: >-
                    Permintaan bertentangan dengan data atau kondisi sistem saat ini (misalnya duplikasi data unik atau
                    benturan jadwal/relasi entitas).
                request_id: req_demo_0004
        '422':
          description: >-
            Validasi data masukan gagal. [VALIDATION_ERROR]: Data input untuk keluar dari aplikasi tidak lolos validasi
            aturan bisnis atau format field.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Data input untuk keluar dari aplikasi tidak lolos validasi aturan bisnis atau format field.
                  details:
                    - field: payload
                      message: Terdapat isian yang belum lengkap atau nilainya berada di luar batasan yang ditentukan.
                request_id: req_demo_0005
        '429':
          description: >-
            Batas frekuensi permintaan terlampaui (Rate limited). [RATE_LIMITED]: Terlalu banyak permintaan. Coba lagi
            beberapa saat lagi.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
            Retry-After:
              description: Jumlah detik untuk menunggu sebelum mengirimkan permintaan berikutnya.
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: RATE_LIMITED
                  message: Terlalu banyak permintaan. Coba lagi beberapa saat lagi.
                request_id: req_demo_0006
        '500':
          description: >-
            Terjadi kesalahan internal pada server. [INTERNAL_ERROR]: Terjadi kesalahan pada server saat memproses
            permintaan.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Terjadi kesalahan pada server saat memproses permintaan.
                request_id: req_demo_0007
      x-roles:
        - tourist
        - partner
        - admin
      x-kf:
        - KF-01
  /user/profile:
    get:
      tags:
        - Autentikasi dan Akun
      summary: Lihat profil pengguna
      description: >-
        Mengembalikan data pengguna yang sedang masuk beserta profil tambahan sesuai peran. Respons menyesuaikan peran
        aktif pada halaman simulasi.
      operationId: getProfile
      responses:
        '200':
          description: Profil berhasil diambil.
          headers:
            X-Request-Id:
              description: ID permintaan untuk penelusuran log.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  message:
                    type: string
                    description: Pesan singkat untuk pengguna.
              examples:
                tourist:
                  summary: Wisatawan
                  value:
                    data:
                      user_id: 8c1a6f2e-5b7d-4a91-9f03-1a2b3c4d5e01
                      nama: Alfian Hanif
                      email: alfian.hanif@example.com
                      nomor_telepon: '+6281321001001'
                      role: tourist
                      profil:
                        preferensi_umum: Wisata Budaya & Kuliner
                        jumlah_itinerary: 2
                        jumlah_notifikasi_belum_dibaca: 3
                partner:
                  summary: Mitra
                  value:
                    data:
                      user_id: 9f2b7a3d-6c8e-4b02-8a14-2b3c4d5e6f11
                      nama: Dewi Lestari
                      email: dewi.lestari@bandungjayatour.co.id
                      nomor_telepon: '+622242020011'
                      role: partner
                      profil:
                        nama_perusahaan: PT Bandung Jaya Tour
                        legalitas_doc_url: /docs/legalitas-bandung-jaya.txt
                        status_verifikasi: true
                        verified_by_admin_id: 7d3c9b1a-4e2f-4c83-b015-3c4d5e6f7a21
                        jumlah_armada: 3
                admin:
                  summary: Admin
                  value:
                    data:
                      user_id: 7d3c9b1a-4e2f-4c83-b015-3c4d5e6f7a21
                      nama: Tantan Nugraha
                      email: tantan.nugraha@findholiday.id
                      nomor_telepon: '+6281122004001'
                      role: admin
                      profil:
                        admin_level: super_admin
                        departemen: Operasional
                        terakhir_aktif: '2026-10-30 15:42:00'
        '400':
          description: >-
            Parameter permintaan tidak valid atau format data salah. [BAD_REQUEST]: Parameter permintaan tidak dapat
            diproses atau format data tidak valid.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: BAD_REQUEST
                  message: Parameter permintaan tidak dapat diproses atau format data tidak valid.
                request_id: req_demo_0001
        '401':
          description: >-
            Autentikasi gagal atau token Bearer tidak valid. [UNAUTHENTICATED]: Sesi tidak valid, token kedaluwarsa,
            atau token tidak dikirim.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Sesi tidak valid, token kedaluwarsa, atau token tidak dikirim.
                request_id: req_demo_0002
        '403':
          description: >-
            Peran pengguna aktif tidak memiliki izin untuk tindakan ini. [FORBIDDEN_ROLE]: Peran aktif tidak memiliki
            izin untuk mengakses sumber daya ini.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: FORBIDDEN_ROLE
                  message: Peran aktif tidak memiliki izin untuk mengakses sumber daya ini.
                request_id: req_demo_0003
        '429':
          description: >-
            Batas frekuensi permintaan terlampaui (Rate limited). [RATE_LIMITED]: Terlalu banyak permintaan. Coba lagi
            beberapa saat lagi.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
            Retry-After:
              description: Jumlah detik untuk menunggu sebelum mengirimkan permintaan berikutnya.
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: RATE_LIMITED
                  message: Terlalu banyak permintaan. Coba lagi beberapa saat lagi.
                request_id: req_demo_0004
        '500':
          description: >-
            Terjadi kesalahan internal pada server. [INTERNAL_ERROR]: Terjadi kesalahan pada server saat memproses
            permintaan.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Terjadi kesalahan pada server saat memproses permintaan.
                request_id: req_demo_0005
      x-roles:
        - tourist
        - partner
        - admin
      x-kf:
        - KF-05
    put:
      tags:
        - Autentikasi dan Akun
      summary: Ubah profil pengguna
      description: Mengubah nama, kontak, atau profil tambahan sesuai peran. Peran akun tidak dapat diubah melalui endpoint ini.
      operationId: updateProfile
      responses:
        '200':
          description: Profil berhasil diperbarui.
          headers:
            X-Request-Id:
              description: ID permintaan untuk penelusuran log.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  message:
                    type: string
                    description: Pesan singkat untuk pengguna.
              example:
                data:
                  user_id: 8c1a6f2e-5b7d-4a91-9f03-1a2b3c4d5e01
                  nama: Alfian Hanif
                  email: alfian.hanif@example.com
                  nomor_telepon: '+6281321001001'
                  role: tourist
                  profil:
                    preferensi_umum: Wisata Budaya & Kuliner
                    jumlah_itinerary: 2
                    jumlah_notifikasi_belum_dibaca: 3
                message: Profil berhasil diperbarui.
        '400':
          description: >-
            Parameter permintaan tidak valid atau format data salah. [BAD_REQUEST]: Struktur tubuh permintaan (request
            body) tidak dapat diproses atau format JSON rusak.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: BAD_REQUEST
                  message: Struktur tubuh permintaan (request body) tidak dapat diproses atau format JSON rusak.
                request_id: req_demo_0001
        '401':
          description: >-
            Autentikasi gagal atau token Bearer tidak valid. [UNAUTHENTICATED]: Sesi tidak valid, token kedaluwarsa,
            atau token tidak dikirim.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Sesi tidak valid, token kedaluwarsa, atau token tidak dikirim.
                request_id: req_demo_0002
        '403':
          description: >-
            Peran pengguna aktif tidak memiliki izin untuk tindakan ini. [FORBIDDEN_ROLE]: Akses ditolak. Peran aktif
            Anda tidak memiliki izin untuk ubah profil pengguna. Endpoint ini dibatasi untuk peran: Wisatawan, Mitra,
            Admin.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: FORBIDDEN_ROLE
                  message: >-
                    Akses ditolak. Peran aktif Anda tidak memiliki izin untuk ubah profil pengguna. Endpoint ini
                    dibatasi untuk peran: Wisatawan, Mitra, Admin.
                request_id: req_demo_0003
        '409':
          description: 'Terjadi konflik data atau tabrakan status entitas. [EMAIL_ALREADY_USED]: Email sudah dipakai oleh akun lain.'
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: EMAIL_ALREADY_USED
                  message: Email sudah dipakai oleh akun lain.
                request_id: req_demo_0004
        '422':
          description: 'Validasi data masukan gagal. [VALIDATION_ERROR]: Data profil belum lengkap atau formatnya belum benar.'
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Data profil belum lengkap atau formatnya belum benar.
                  details:
                    - field: email
                      message: Format email belum benar.
                request_id: req_demo_0005
        '429':
          description: >-
            Batas frekuensi permintaan terlampaui (Rate limited). [RATE_LIMITED]: Frekuensi permintaan melampaui batas
            kuota API Find Holiday. Silakan tunggu beberapa saat sebelum mengirim permintaan kembali.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
            Retry-After:
              description: Jumlah detik untuk menunggu sebelum mengirimkan permintaan berikutnya.
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: RATE_LIMITED
                  message: >-
                    Frekuensi permintaan melampaui batas kuota API Find Holiday. Silakan tunggu beberapa saat sebelum
                    mengirim permintaan kembali.
                request_id: req_demo_0006
        '500':
          description: >-
            Terjadi kesalahan internal pada server. [INTERNAL_ERROR]: Terjadi kesalahan pada server saat memproses
            permintaan.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Terjadi kesalahan pada server saat memproses permintaan.
                request_id: req_demo_0007
