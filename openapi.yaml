            example:
              nama: Alfian Hanif
              email: alfian.hanif@example.com
              nomor_telepon: '+6281321001001'
              preferensi_umum: Wisata Budaya & Kuliner
  /user/password:
    put:
      tags:
        - Autentikasi dan Akun
      summary: Ubah kata sandi
      description: >-
        Mengganti kata sandi setelah memeriksa kata sandi lama. Setelah berhasil, token lama tetap berlaku sampai
        dicabut melalui logout.
      operationId: updatePassword
      responses:
        '200':
          description: Kata sandi berhasil diperbarui.
          headers:
            X-Request-Id:
              description: ID permintaan untuk penelusuran log.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      diperbarui:
                        type: boolean
                        example: true
                  message:
                    type: string
              example:
                data:
                  diperbarui: true
                message: Kata sandi berhasil diperbarui.
        '400':
          description: >-
            Parameter permintaan tidak valid atau format data salah. [BAD_REQUEST]: Struktur tubuh permintaan (request
            body) tidak dapat diproses atau format JSON rusak.
