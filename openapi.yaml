      required:
        - email
        - password
      properties:
        email:
          type: string
          description: Alamat email terdaftar.
          format: email
          example: alfian.hanif@example.com
        password:
          type: string
          description: Kata sandi.
          format: password
          example: RahasiaDemo123!
    ProfileUpdateInput:
      type: object
      description: Perubahan profil. Hanya field yang dikirim yang diubah. Peran tidak dapat diubah dari endpoint ini.
      properties:
        nama:
          type: string
          description: Nama lengkap.
          example: Alfian Hanif
        email:
          type: string
          description: Alamat email.
          format: email
          example: alfian.hanif@example.com
        nomor_telepon:
          type: string
          description: Nomor telepon.
          example: '+6281321001001'
        preferensi_umum:
          type: string
          description: Preferensi wisatawan.
          example: Wisata Budaya & Kuliner
        nama_perusahaan:
          type: string
          description: Nama perusahaan mitra.
          example: PT Bandung Jaya Tour
        legalitas_doc_url:
          type: string
          description: URL dokumen legalitas mitra.
          example: /docs/legalitas-bandung-jaya.txt
    PasswordUpdateInput:
      type: object
      description: Perubahan kata sandi.
      required:
        - password_lama
        - password
        - password_confirmation
      properties:
        password_lama:
          type: string
          description: Kata sandi saat ini.
          format: password
          example: RahasiaDemo123!
        password:
          type: string
          description: Kata sandi baru minimal 8 karakter.
          format: password
          minLength: 8
          example: RahasiaBaru456!
        password_confirmation:
          type: string
          description: Ulangi kata sandi baru.
          format: password
          example: RahasiaBaru456!
    ItineraryInput:
      type: object
      description: Data pembuatan itinerary beserta preferensi dan destinasi.
      required:
        - judul_perjalanan
        - tanggal_mulai
        - tanggal_selesai
        - jumlah_wisatawan
        - total_anggaran
        - destinasi
      properties:
        judul_perjalanan:
          type: string
          description: Judul perjalanan.
          example: Bandung Heritage & Kuliner Weekend
        start_place_id:
          type: string
          format: uuid
          description: ID tempat awal perjalanan.
        tanggal_mulai:
          type: string
          format: date
          description: Tanggal mulai.
        tanggal_selesai:
          type: string
          format: date
          description: Tanggal selesai.
        jumlah_wisatawan:
          type: integer
          description: Jumlah wisatawan.
          minimum: 1
          example: 2
        total_anggaran:
          type: number
          description: Total anggaran dalam rupiah.
          minimum: 0
          example: 1500000
        prioritas_utama:
          type: string
          description: Prioritas utama perjalanan.
          enum:
            - kecepatan
            - biaya
            - kenyamanan
          example: kenyamanan
        hindari_jalan_kaki_jauh:
          type: boolean
          description: Hindari jalan kaki jauh.
        maksimal_transit:
          type: integer
          description: Batas maksimal transit.
          minimum: 0
          maximum: 5
          example: 2
        preferensi_biaya:
          type: string
          description: Gaya biaya perjalanan.
          enum:
            - hemat
            - standar
            - premium
          example: standar
        destinasi:
          type: array
          description: Daftar destinasi berurutan. Minimal satu destinasi.
          items:
            $ref: '#/components/schemas/ItineraryStopInput'
    ItineraryStopInput:
      type: object
      description: Satu destinasi pada permintaan itinerary.
      required:
        - place_id
        - waktu_mulai_rencana
        - waktu_selesai_rencana
      properties:
        place_id:
          type: string
          format: uuid
          description: ID tempat kunjungan.
        waktu_mulai_rencana:
          type: string
          description: Waktu mulai kunjungan. Format YYYY-MM-DD HH:MM:SS.
          example: '2026-10-30 14:10:00'
        waktu_selesai_rencana:
          type: string
          description: Waktu selesai kunjungan. Format YYYY-MM-DD HH:MM:SS.
          example: '2026-10-30 14:10:00'
    StopsReorderInput:
      type: object
      description: Perubahan urutan perhentian itinerary.
      required:
        - destinasi
      properties:
        destinasi:
          type: array
          description: Daftar perhentian dengan urutan baru.
          items:
            $ref: '#/components/schemas/ReorderStopInput'
    ReorderStopInput:
      type: object
      description: Satu perhentian pada perubahan urutan.
      required:
        - plan_item_id
        - urutan
      properties:
        plan_item_id:
          type: string
          format: uuid
          description: ID perhentian.
        urutan:
          type: integer
          description: Urutan baru.
          minimum: 1
          example: 1
    FleetInput:
      type: object
      description: Data armada mitra.
      required:
        - nama_moda
        - jenis_transportasi
        - kapasitas_penumpang
      properties:
        wilayah_id:
          type: string
          format: uuid
          description: ID wilayah layanan.
        nama_moda:
          type: string
          description: Nama moda atau armada.
          example: GoCar Bandung
        jenis_transportasi:
          type: string
          description: Jenis transportasi.
          enum:
            - BUS
            - ANGKOT
            - ONLINE_TAXI
            - ONLINE_MOTOR
            - RENTAL
            - PEDESTRIAN
            - SHUTTLE
          example: ONLINE_TAXI
        kapasitas_penumpang:
          type: integer
          description: Kapasitas penumpang.
          minimum: 1
          example: 4
        status_aktif:
          type: boolean
          description: Status aktif armada.
        sumber_data:
          type: string
          description: Sumber data.
          example: Mitra Portal
        detail:
          $ref: '#/components/schemas/TransportDetailInput'
    TransportDetailInput:
      type: object
      description: Rincian tarif sesuai jenis transportasi.
      properties:
        nomor_trayek:
          type: string
          description: Nomor trayek.
          example: Koridor 3
        rute_halte:
          type: array
          description: Daftar halte.
          items:
            type: string
            description: Nama halte.
        tarif_tetap:
          type: number
          description: Tarif tetap dalam rupiah.
          example: 4900
        interval_menit:
          type: integer
          description: Interval kedatangan dalam menit.
          example: 15
        tarif_dasar:
          type: number
          description: Tarif dasar dalam rupiah.
          example: 10000
        tarif_per_km:
          type: number
          description: Tarif per kilometer dalam rupiah.
          example: 4500
        surge_multiplier:
          type: number
          description: Pengali tarif.
          example: 1.2
        tarif_per_hari:
          type: number
          description: Tarif sewa per hari dalam rupiah.
          example: 450000
        termasuk_driver:
          type: boolean
          description: Termasuk driver.
        jenis_bahan_bakar:
          type: string
          description: Jenis bahan bakar.
          example: Bensin
        kecepatan_rata_rata_km_jam:
          type: number
          description: Kecepatan rata-rata pejalan kaki.
          example: 4.5
        is_jalur_pedestrian_tersedia:
          type: boolean
          description: Jalur pedestrian tersedia.
    TransportModeInput:
      allOf:
        - $ref: '#/components/schemas/FleetInput'
        - type: object
          properties:
            mitra_id:
              type: string
              format: uuid
              description: ID mitra pemilik armada, diisi admin bila perlu.
    RegionInput:
      type: object
      description: Data wilayah.
      required:
        - nama_wilayah
        - provinsi
      properties:
        nama_wilayah:
          type: string
          description: Nama wilayah.
          example: Kota Bandung
        provinsi:
          type: string
          description: Nama provinsi.
          example: Jawa Barat
        boundary_coordinates:
          type: array
          description: Batas wilayah.
          items:
            type: array
            description: Pasangan longitude dan latitude.
            items:
              type: number
              description: Koordinat.
        status_cakupan_aktif:
          type: boolean
          description: Status cakupan layanan.
    PlaceInput:
      type: object
      description: Data tempat kunjungan dan detail destinasi.
      required:
        - wilayah_id
        - nama_tempat
        - alamat_lengkap
        - latitude
        - longitude
        - kategori_wisata
      properties:
        wilayah_id:
          type: string
          format: uuid
          description: ID wilayah.
        nama_tempat:
          type: string
          description: Nama tempat.
          example: Gedung Sate
        alamat_lengkap:
          type: string
          description: Alamat lengkap.
          example: Jl. Diponegoro No.22, Citarum, Kec. Bandung Wetan
        latitude:
          type: number
          description: Koordinat lintang.
          example: -6.902484
        longitude:
          type: number
          description: Koordinat bujur.
          example: 107.618765
        jam_buka:
          type: string
          description: Jam buka.
          example: '08:00'
        jam_tutup:
          type: string
          description: Jam tutup.
          example: '16:00'
        daftar_foto_url:
          type: array
          description: Daftar URL foto.
          items:
            type: string
            description: URL foto.
        kategori_wisata:
          type: string
          description: Kategori wisata.
          example: sejarah
        estimasi_durasi_kunjungan:
          type: integer
          description: Estimasi durasi kunjungan dalam menit.
          example: 90
        harga_tiket_masuk:
          type: number
          description: Harga tiket masuk dalam rupiah.
          example: 5000
    FacilityInput:
      type: object
      description: Data fasilitas pada tempat.
      required:
        - jenis
        - is_gratis
        - fasilitas_tersedia
      properties:
        jenis:
          type: string
          description: Jenis fasilitas.
          enum:
            - TEMPAT_IBADAH
            - RESTORAN_KULINER
            - TOILET_UMUM
            - HOTEL_PENGINAPAN
            - SPBU
            - ATM
          example: ATM
        is_gratis:
          type: boolean
          description: Fasilitas gratis.
        fasilitas_tersedia:
          type: array
          description: Daftar fasilitas.
          items:
            type: string
            description: Nama fasilitas.
    ContextInput:
      type: object
      description: Data konteks cuaca dan lalu lintas wilayah.
      required:
        - wilayah_id
        - kondisi_cuaca
        - kondisi_lalu_lintas
      properties:
        wilayah_id:
          type: string
          format: uuid
          description: ID wilayah.
        kondisi_cuaca:
          type: string
          description: Kondisi cuaca.
          example: Hujan Ringan
        suhu_celsius:
          type: number
          description: Suhu dalam derajat Celsius.
          example: 24.5
        tingkat_curah_hujan:
          type: number
          description: Curah hujan dalam milimeter per jam.
          example: 8.4
        kondisi_lalu_lintas:
          type: string
          description: Kondisi lalu lintas.
          example: Padat
        ada_insiden_kecelakaan:
          type: boolean
          description: Ada insiden kecelakaan.
        rata_rata_kepadatan_jalan:
          type: number
          description: Kepadatan jalan dari 0 sampai 1.
          example: 0.72
    ReviewInput:
      type: object
      description: Ulasan baru untuk destinasi.
      required:
        - skor_rating
        - isi_komentar
      properties:
        skor_rating:
          type: number
          description: Nilai rating 1 sampai 5.
          minimum: 1
          maximum: 5
          example: 5
        isi_komentar:
          type: string
          description: Isi ulasan.
          minLength: 10
          maxLength: 2000
          example: Bangunan ikonik dengan taman yang tertata. Tur museum informatif dan petugas ramah.
    ReviewModerationInput:
      type: object
      description: Keputusan moderasi ulasan.
      required:
        - status_publikasi
      properties:
        status_publikasi:
          type: boolean
          description: Apakah ulasan dipublikasikan.
        catatan_moderasi:
          type: string
          description: Catatan moderator.
          example: Ulasan sudah diperiksa dan layak tampil.
    UserUpdateInput:
      type: object
      description: Perubahan data pengguna oleh admin.
      properties:
        nama:
          type: string
          description: Nama lengkap.
          example: Salsabila Putri
        email:
          type: string
          description: Alamat email.
          format: email
          example: salsabila.putri@example.com
        nomor_telepon:
          type: string
          description: Nomor telepon.
          example: '+6281321001002'
        role:
          type: string
          description: Peran pengguna.
          enum:
            - tourist
            - partner
            - admin
          example: tourist
    PartnerVerificationInput:
      type: object
      description: Keputusan verifikasi mitra.
      required:
        - status_verifikasi
      properties:
        status_verifikasi:
          type: boolean
          description: Apakah mitra diverifikasi.
        catatan:
          type: string
          description: Catatan verifikasi.
          example: Dokumen legalitas lengkap dan sesuai.
