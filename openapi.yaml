            coordinates:
              type: array
              description: Longitude dan latitude.
              items:
                type: number
                description: Koordinat.
        - type: object
          required:
            - type
            - coordinates
          properties:
            type:
              type: string
              description: Tipe geometri garis.
              enum:
                - LineString
            coordinates:
              type: array
              description: Daftar titik garis.
              items:
                type: array
                description: Pasangan longitude dan latitude.
                items:
                  type: number
                  description: Koordinat.
