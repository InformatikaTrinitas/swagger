  /admin/transport-modes:
    get:
      tags:
        - Admin
      summary: Daftar moda transportasi
      description: Menampilkan seluruh moda transportasi, termasuk yang tidak aktif, untuk pengelolaan data transportasi.
      operationId: listAdminTransportModes
      parameters:
        - in: query
          name: mitra_id
          required: false
          description: Filter mitra.
          schema:
            type: string
            format: uuid
          example: 9f2b7a3d-6c8e-4b02-8a14-2b3c4d5e6f11
        - in: query
          name: jenis_transportasi
          required: false
          description: Filter jenis transportasi.
          schema:
            type: string
            enum:
              - BUS
              - ANGKOT
              - ONLINE_TAXI
              - ONLINE_MOTOR
              - RENTAL
              - PEDESTRIAN
              - SHUTTLE
        - in: query
          name: status_aktif
          required: false
          description: Filter status aktif.
          schema:
            type: boolean
        - in: query
          name: q
          required: false
          description: Cari nama moda.
          schema:
            type: string
          example: bandung
        - in: query
          name: page
          required: false
          description: Halaman data yang diminta.
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: per_page
          required: false
          description: Jumlah data per halaman.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Daftar moda transportasi berhasil diambil.
          headers:
            X-Request-Id:
              description: ID permintaan untuk penelusuran log.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransportMode'
                  message:
                    type: string
                    description: Pesan singkat untuk pengguna.
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                data:
                  - transportasi_id: f1000000-0000-4000-8000-000000000001
                    wilayah_id: a1000000-0000-4000-8000-000000000001
                    mitra_id: 9f2b7a3d-6c8e-4b02-8a14-2b3c4d5e6f12
                    nama_moda: Trans Metro Bandung Koridor 3
                    jenis_transportasi: BUS
                    kapasitas_penumpang: 60
                    status_aktif: true
                    sumber_data: GTFS Feed
                    terakhir_diperbarui: '2026-10-30 06:00:00'
                    wilayah:
                      wilayah_id: a1000000-0000-4000-8000-000000000001
                      nama_wilayah: Kota Bandung
