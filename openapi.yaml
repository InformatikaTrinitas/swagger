                      status_publikasi:
                        before: true
                        after: false
                      alasan: Menunggu pemeriksaan moderator
                    aktor_pelaksana: Johannes Putra
                    waktu_log: '2026-10-29 19:02:00'
                meta:
                  page: 1
                  per_page: 10
                  total: 3
                  total_pages: 1
        '400':
          description: >-
            Parameter permintaan tidak valid atau format data salah. [BAD_REQUEST]: Parameter permintaan tidak dapat
            diproses atau format data tidak valid. Parameter permintaan tidak valid atau format data salah.
            [BAD_REQUEST]: Filter audit tidak valid.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                bad_request:
                  summary: 'BAD_REQUEST: Filter audit tidak valid.'
                  value:
                    error:
                      code: BAD_REQUEST
                      message: Filter audit tidak valid.
                    request_id: req_demo_0001
        '401':
          description: >-
            Autentikasi gagal atau token Bearer tidak valid. [UNAUTHENTICATED]: Sesi tidak valid, token kedaluwarsa,
            atau token tidak dikirim.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Sesi tidak valid, token kedaluwarsa, atau token tidak dikirim.
                request_id: req_demo_0002
        '403':
          description: >-
            Peran pengguna aktif tidak memiliki izin untuk tindakan ini. [FORBIDDEN_ROLE]: Peran aktif tidak memiliki
            izin untuk mengakses sumber daya ini.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: FORBIDDEN_ROLE
                  message: Peran aktif tidak memiliki izin untuk mengakses sumber daya ini.
                request_id: req_demo_0003
        '429':
          description: >-
            Batas frekuensi permintaan terlampaui (Rate limited). [RATE_LIMITED]: Terlalu banyak permintaan. Coba lagi
            beberapa saat lagi.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
            Retry-After:
              description: Jumlah detik untuk menunggu sebelum mengirimkan permintaan berikutnya.
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: RATE_LIMITED
                  message: Terlalu banyak permintaan. Coba lagi beberapa saat lagi.
                request_id: req_demo_0004
        '500':
          description: >-
            Terjadi kesalahan internal pada server. [INTERNAL_ERROR]: Terjadi kesalahan pada server saat memproses
            permintaan.
          headers:
            X-Request-Id:
              description: ID unik permintaan untuk penelusuran audit dan log server.
              schema:
                type: string
                example: req_demo_0001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Terjadi kesalahan pada server saat memproses permintaan.
                request_id: req_demo_0005
      x-roles:
        - admin
      x-kf:
        - KF-19
        - KF-33
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
      description: >-
        Token Bearer Sanctum untuk autentikasi API Find Holiday. Pada simulasi Swagger ini, token diisi secara otomatis
        sesuai peran aktif yang Anda pilih pada panel bilah atas.


        Contoh token demo siap pakai:

        - **Wisatawan**: `1|fh_demo_tourist_9f8e7d6c5b4a39281706`

        - **Mitra Transportasi**: `2|fh_demo_partner_4c3b2a1908f7e6d5c4b3`

        - **Administrator**: `3|fh_demo_admin_7a6b5c4d3e2f1908a7b6`
  schemas:
    Meta:
      type: object
      description: Informasi halaman untuk respons daftar.
      required:
        - page
        - per_page
        - total
        - total_pages
      properties:
        page:
          type: integer
          description: Halaman yang dikembalikan.
          minimum: 1
          example: 1
        per_page:
          type: integer
          description: Jumlah data per halaman.
          minimum: 1
          maximum: 100
          example: 10
        total:
          type: integer
          description: Total data yang sesuai filter.
          minimum: 0
          example: 4
        total_pages:
          type: integer
          description: Total halaman.
          minimum: 1
          example: 1
    ErrorDetail:
      type: object
      description: Rincian satu kesalahan validasi atau konflik.
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Nama field yang bermasalah.
          example: email
        message:
          type: string
          description: Penjelasan singkat untuk field tersebut.
          example: Format email belum benar.
    Error:
      type: object
      description: Objek kesalahan yang konsisten untuk seluruh endpoint.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Kode kesalahan yang stabil untuk kebutuhan integrasi.
          example: VALIDATION_ERROR
        message:
          type: string
          description: Pesan yang dapat ditampilkan kepada pengguna.
          example: Data yang dikirim belum lengkap.
        details:
          type: array
          description: Rincian kesalahan bila tersedia.
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorEnvelope:
      type: object
      description: Amplop respons kesalahan.
      required:
        - error
        - request_id
      properties:
        error:
          $ref: '#/components/schemas/Error'
        request_id:
          type: string
          description: ID permintaan untuk penelusuran log.
          example: req_demo_0001
    UserProfile:
      type: object
      description: Data profil tambahan sesuai peran. Field yang tidak relevan tidak dikirim.
      properties:
        preferensi_umum:
          type: string
          description: Preferensi perjalanan wisatawan.
          example: Wisata Budaya & Kuliner
        jumlah_itinerary:
          type: integer
          description: Jumlah itinerary milik wisatawan.
          example: 2
        jumlah_notifikasi_belum_dibaca:
          type: integer
          description: Jumlah notifikasi yang belum dibaca.
          example: 3
        nama_perusahaan:
          type: string
          description: Nama badan usaha mitra.
          example: PT Bandung Jaya Tour
        legalitas_doc_url:
          type: string
          description: URL dokumen legalitas mitra.
          example: /docs/legalitas-bandung-jaya.txt
          nullable: true
        status_verifikasi:
          type: boolean
          description: Status verifikasi mitra oleh admin.
        verified_by_admin_id:
          type: string
          format: uuid
          description: Admin yang memverifikasi mitra.
          nullable: true
        jumlah_armada:
          type: integer
          description: Jumlah armada aktif milik mitra.
          example: 3
        admin_level:
          type: string
          description: Tingkat administrator.
          example: super_admin
        departemen:
          type: string
          description: Departemen administrator.
          example: Operasional
        terakhir_aktif:
          type: string
          description: Waktu terakhir administrator aktif. Format YYYY-MM-DD HH:MM:SS.
          example: '2026-10-30 14:10:00'
    User:
      type: object
      description: Data pengguna beserta profil sesuai peran.
      required:
        - user_id
        - nama
        - email
        - role
      properties:
        user_id:
          type: string
          format: uuid
          description: ID pengguna.
        nama:
          type: string
          description: Nama lengkap.
          example: Alfian Hanif
        email:
          type: string
          description: Alamat email.
          format: email
          example: alfian.hanif@example.com
        nomor_telepon:
          type: string
          description: Nomor telepon dalam format internasional.
          example: '+6281321001001'
          nullable: true
        role:
          type: string
          description: Peran pengguna.
          enum:
            - tourist
            - partner
            - admin
          example: tourist
        profil:
          $ref: '#/components/schemas/UserProfile'
    AuthSession:
      type: object
      description: Sesi pengguna setelah registrasi atau login.
      required:
        - user
        - token
        - token_type
        - abilities
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: Token Bearer untuk permintaan berikutnya.
          example: 1|fh_demo_tourist_9f8e7d6c5b4a39281706
        token_type:
          type: string
          description: Jenis token.
          example: Bearer
        abilities:
          type: array
          description: Daftar izin yang melekat pada token.
          items:
            type: string
            description: Kemampuan token.
    RegionSummary:
      type: object
      description: Ringkasan wilayah.
      required:
        - wilayah_id
        - nama_wilayah
        - provinsi
      properties:
        wilayah_id:
          type: string
          format: uuid
          description: ID wilayah.
        nama_wilayah:
          type: string
          description: Nama wilayah.
          example: Kota Bandung
        provinsi:
          type: string
          description: Nama provinsi.
          example: Jawa Barat
    Region:
      type: object
      description: Wilayah layanan beserta batas geografis.
      required:
        - wilayah_id
        - nama_wilayah
        - provinsi
        - status_cakupan_aktif
      properties:
        wilayah_id:
          type: string
          format: uuid
          description: ID wilayah.
        nama_wilayah:
          type: string
          description: Nama kabupaten atau kota.
          example: Kota Bandung
        provinsi:
          type: string
          description: Nama provinsi.
          example: Jawa Barat
        boundary_coordinates:
          type: array
          description: Garis batas wilayah dalam format GeoJSON sederhana.
          items:
            type: array
            description: Pasangan longitude dan latitude.
            items:
              type: number
              description: Koordinat.
        status_cakupan_aktif:
          type: boolean
          description: Apakah wilayah sedang dilayani.
        jumlah_destinasi:
          type: integer
          description: Jumlah destinasi di wilayah ini.
          example: 9
    Facility:
      type: object
      description: Fasilitas utilitas pada satu tempat.
      required:
        - fasilitas_id
        - place_id
        - jenis
        - is_gratis
        - fasilitas_tersedia
      properties:
        fasilitas_id:
          type: string
          format: uuid
          description: ID fasilitas. Nilai ini ditambahkan pada kontrak karena satu tempat dapat memiliki beberapa fasilitas.
        place_id:
          type: string
          format: uuid
          description: ID tempat pemilik fasilitas.
        jenis:
          type: string
          description: Jenis fasilitas.
          enum:
            - TEMPAT_IBADAH
            - RESTORAN_KULINER
            - TOILET_UMUM
            - HOTEL_PENGINAPAN
            - SPBU
            - ATM
          example: ATM
        is_gratis:
          type: boolean
          description: Apakah fasilitas dapat digunakan tanpa biaya.
        fasilitas_tersedia:
          type: array
          description: Daftar fasilitas yang tersedia.
          items:
            type: string
            description: Nama fasilitas.
    PlaceSummary:
      type: object
      description: Ringkasan tempat kunjungan.
      required:
        - place_id
        - nama_tempat
        - latitude
        - longitude
      properties:
        place_id:
          type: string
          format: uuid
