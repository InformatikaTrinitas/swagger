      requestBody:
        required: true
        description: Data itinerary yang dapat diubah admin.
        content:
          application/json:
            schema:
              type: object
              description: Perubahan data itinerary oleh admin.
              properties:
                judul_perjalanan:
                  type: string
                  example: Bandung Heritage & Kuliner Weekend
                tanggal_mulai:
                  type: string
                  format: date
                  example: '2026-11-14'
                tanggal_selesai:
                  type: string
                  format: date
                  example: '2026-11-15'
                jumlah_wisatawan:
                  type: integer
                  minimum: 1
                  example: 2
                total_anggaran:
                  type: number
                  example: 1500000
                status_rencana:
                  type: string
                  enum:
                    - draft
                    - aktif
                    - selesai
                    - dibatalkan
                  example: selesai
                prioritas_utama:
                  type: string
                  enum:
                    - kecepatan
                    - biaya
                    - kenyamanan
                  example: kenyamanan
                hindari_jalan_kaki_jauh:
                  type: boolean
                  example: true
                maksimal_transit:
                  type: integer
                  minimum: 0
                  maximum: 5
                  example: 2
                preferensi_biaya:
                  type: string
                  enum:
                    - hemat
                    - standar
                    - premium
                  example: standar
            example:
              judul_perjalanan: Bandung Heritage & Kuliner Weekend
              tanggal_mulai: '2026-11-14'
              tanggal_selesai: '2026-11-15'
              jumlah_wisatawan: 2
              total_anggaran: 1500000
              status_rencana: selesai
              prioritas_utama: kenyamanan
              hindari_jalan_kaki_jauh: true
              maksimal_transit: 2
              preferensi_biaya: standar
