          example: -6.902484
        longitude:
          type: number
          description: Koordinat bujur.
          example: 107.618765
        rating_rata_rata:
          type: number
          description: Rata-rata rating.
          example: 4.7
        jumlah_review:
          type: integer
          description: Jumlah ulasan.
          example: 3210
        estimasi_durasi_kunjungan:
          type: integer
